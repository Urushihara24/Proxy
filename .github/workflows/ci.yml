name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    paths:
      - "*.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run offline unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_proxy_seller_client.py

      - name: Compile runtime modules
        run: >-
          python -m compileall -q
          app.py
          desktop_proxy_launcher.py
          proxy_seller_client.py
          system_proxy.py
